name: AIBI Assistant
on:
  pull_request:
    paths: ['labs/aibi-assistant/**', '.github/workflows/aibi-assistant.yml']
  push:
    paths: ['labs/aibi-assistant/**', '.github/workflows/aibi-assistant.yml']
permissions:
  contents: read
jobs:
  security-and-workflows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/aibi-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q aibi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check aibi/web/app.js
