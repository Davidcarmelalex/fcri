name: AZRAEL core

on:
  pull_request:
    paths:
      - 'azrael/azrael-core/**'
      - '.github/workflows/azrael-core.yml'
  push:
    branches: [main]
    paths:
      - 'azrael/azrael-core/**'
      - '.github/workflows/azrael-core.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies
        run: python -m pip install -e ./azrael/azrael-core 'pytest>=7.4,<10' 'pytest-asyncio>=0.23,<2'
      - name: Verify installed import outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c 'import azrael_core; print(azrael_core.__version__)'
      - name: Test authorization and core behavior
        run: python -m pytest -q azrael/azrael-core/tests
