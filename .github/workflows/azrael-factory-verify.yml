name: FCRI AZRAEL factory verification
on:
  pull_request:
    paths:
      - 'engineering-factory/**'
      - 'azrael/azrael-core/**'
      - '.github/workflows/azrael-factory-verify.yml'
  push:
    branches: [main]
    paths:
      - 'engineering-factory/**'
      - 'azrael/azrael-core/**'
      - '.github/workflows/azrael-factory-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azrael-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Factory and AZRAEL / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate portable gate ledger
        run: python engineering-factory/shared/skills/autonomous-engineering-factory/verify_factory.py engineering-factory/adapters/azrael-gates.json
      - name: Portable factory regression tests
        run: python -m unittest discover -s engineering-factory/shared/skills/autonomous-engineering-factory -p 'test_*.py' -v
      - name: Install existing AZRAEL test requirements
        run: |
          python -m pip install -r azrael/azrael-core/requirements.txt
          python -m pip install -e azrael/azrael-core
      - name: AZRAEL synthetic core tests
        run: python -m pytest -q azrael/azrael-core/tests
