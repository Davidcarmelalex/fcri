version: '3.9'
services:
  api:
    build: ../../services/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./mrnothing.db

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
