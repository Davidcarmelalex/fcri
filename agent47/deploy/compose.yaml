# AGENT47 RED COMMAND public research stack; private Telegram bot is separate.
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ../webapp:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=32m
      - /var/run:rw,nosuid,size=8m
      - /tmp:rw,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx's default image may require root to bind port 80.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/launch.html"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    build: ../gateway
    restart: unless-stopped
    env_file:
      - ../gateway/.env
    ports:
      - "127.0.0.1:8787:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
